name: Daily Interview Scraper

on:
  push:
    branches:
      - main
    paths:
      - 'scraper/**'
      - '.github/workflows/scrape.yml'
  schedule:
    - cron: '0 2 */2 * *'   # ~2am UTC every alternate day (actual run randomized by upto 30min delay)
    - cron: '0 14 * * 3'  # ~2pm UTC every Wednesday (mid-week refresh)
  workflow_dispatch:

jobs:
  scrape-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Random delay to avoid predictable scraping pattern
        run: |
          DELAY=$((RANDOM % 1800))
          echo "Sleeping for ${DELAY}s before scraping…"
          sleep $DELAY

      - name: Run scraper
        run: |
          python3 scraper/scraper.py
        continue-on-error: false

      - name: Run LLM processor
        run: |
          python3 scraper/processor.py
        continue-on-error: false

      - name: Report status
        if: always()
        run: echo "Pipeline completed at $(date -u)"
